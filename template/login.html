<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Goods — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0d1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 2.5rem;
      background: #16213e;
      border: 1px solid #1f2d45;
      border-radius: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: #6366f1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .brand-name { font-size: 17px; font-weight: 700; }
    .brand-sub  { font-size: 12px; color: #64748b; margin-top: 1px; }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #1f2d45;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #6366f1; }

    .btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.7rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: #4f52d4; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      margin-top: 0.9rem;
      padding: 0.6rem 0.85rem;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      color: #f87171;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">SG</div>
      <div>
        <div class="brand-name">Space Goods</div>
        <div class="brand-sub">Cashflow Dashboard</div>
      </div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Enter username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
      </div>
      <button class="btn" type="submit" id="loginBtn">Sign in</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      err.style.display = "none";

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        }),
      });

      const data = await res.json();
      if (data.success) {
        window.location.href = "/";
      } else {
        err.textContent = data.error || "Login failed.";
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
