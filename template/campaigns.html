<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Goods — Marketing Campaigns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    html, body { overflow: hidden auto; }

    .camp-page { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Top bar ── */
    .camp-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.875rem 2rem;
      display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
    }
    .camp-header .brand { flex-shrink: 0; }
    .camp-header-actions {
      display: flex; align-items: center; gap: 0.625rem;
      flex-wrap: wrap; margin-left: auto;
    }
    #lastRefreshed { font-size: 11.5px; color: var(--text-muted); }

    /* ── Main ── */
    .camp-main {
      flex: 1; padding: 2rem 2.5rem;
      display: flex; flex-direction: column; gap: 1rem;
    }

    /* ── Platform grid ── */
    .platforms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 1rem;
    }

    /* ── Platform card ── */
    .platform-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-sm);
      transition: border-color .2s;
    }
    .platform-card:hover { border-color: var(--border-hi); }

    .platform-header {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 0.75rem; margin-bottom: 1rem;
      padding-bottom: 0.875rem; border-bottom: 1px solid var(--border);
    }
    .platform-badge {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 3px 10px; border-radius: 99px;
    }
    .platform-meta     { background: rgba(24,119,242,.15); color: #60a5fa; border: 1px solid rgba(24,119,242,.25); }
    .platform-google   { background: rgba(66,133,244,.15); color: #93c5fd; border: 1px solid rgba(66,133,244,.25); }
    .platform-amazon   { background: rgba(255,153,0,.15);  color: #fbbf24; border: 1px solid rgba(255,153,0,.25); }
    .platform-flipkart { background: rgba(247,79,0,.15);   color: #f97316; border: 1px solid rgba(247,79,0,.25); }

    .platform-totals { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-left: auto; }
    .ptotal { font-size: 12.5px; color: var(--text-muted); }
    .ptotal strong { color: var(--text); margin-left: 4px; font-weight: 700; }
    .ptotal-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .roas-badge strong { color: var(--green); }

    .platform-empty {
      padding: 1.5rem 1rem; text-align: center;
      color: var(--text-muted); font-size: 13px;
      border-radius: var(--radius-sm); background: var(--surface2);
    }
    .platform-empty a { color: var(--accent); text-decoration: none; }
    .platform-empty a:hover { text-decoration: underline; }
    .platform-error {
      background: rgba(244,63,94,.06);
      border: 1px solid rgba(244,63,94,.15);
      color: var(--red);
    }
    .empty-icon { margin-right: 0.4rem; }

    /* ── Campaign table ── */
    .camp-table-wrap { overflow-x: auto; }
    .camp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .camp-table th {
      font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); padding: 0.5rem 0.75rem;
      text-align: left; border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .camp-table td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
      color: var(--text); white-space: nowrap;
    }
    .camp-table tr:last-child td { border-bottom: none; }
    .camp-table tbody tr:hover td { background: var(--surface2); }
    .camp-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .camp-name { font-weight: 500; max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
    .roas-cell { color: var(--green); font-weight: 600; }

    /* ── Settings panel ── */
    .camp-settings-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-sm);
    }
    .camp-settings-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 1rem 1.5rem; cursor: pointer;
      font-size: 13px; font-weight: 600; color: var(--text-dim);
      transition: background .15s;
    }
    .camp-settings-header:hover { background: var(--surface2); }
    .camp-settings-toggle { margin-left: auto; font-size: 12px; color: var(--text-muted); }
    .camp-settings-body { padding: 1.25rem 1.5rem 1.5rem; border-top: 1px solid var(--border); }

    .cred-platform-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 0.25rem; }
    .cred-guide { font-size: 11.5px; color: var(--text-muted); margin-bottom: 0.875rem; }
    .cred-fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75rem;
    }

    .skel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
    }

    @media (max-width: 700px) {
      .camp-header { padding: 0.75rem 1rem; }
      .camp-main   { padding: 1rem; }
      .platforms-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-is-admin="{{ 'true' if is_admin else 'false' }}" data-username="{{ username }}">
  <div class="camp-page">

    <!-- Header -->
    <header class="camp-header">
      <div class="brand">
        <div class="brand-icon">SG</div>
        <div>
          <div class="brand-name">Space Goods</div>
          <div class="brand-sub">Marketing Campaigns</div>
        </div>
      </div>
      <div class="camp-header-actions">
        <select id="rangeSelect" class="select-sm">
          <option value="0">Today</option>
          <option value="7" selected>Last 7 days</option>
          <option value="30">This month</option>
        </select>
        <button class="btn btn-outline btn-sm" id="refreshBtn">↻ Refresh</button>
        <span id="lastRefreshed"></span>
        <a href="/" class="btn btn-outline btn-sm">← Dashboard</a>
        <div class="sidebar-user" style="border-top:none;padding-top:0;margin-top:0;">
          <span class="sidebar-username">{{ username }}</span>
          <a href="/logout" class="btn-logout" title="Sign out">⏻</a>
        </div>
      </div>
    </header>

    <!-- Main content -->
    <main class="camp-main">
      <div id="platforms" class="platforms-grid"></div>

      <!-- Credentials settings -->
      <div class="camp-settings-wrap" id="settingsPanel">
        <div class="camp-settings-header" onclick="toggleSettings()">
          <span>⚙ Platform Credentials</span>
          <span class="camp-settings-toggle" id="settingsToggle">▸</span>
        </div>
        <div class="camp-settings-body" id="settingsBody" style="display:none;"></div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/js/campaigns.js"></script>
</body>
</html>
